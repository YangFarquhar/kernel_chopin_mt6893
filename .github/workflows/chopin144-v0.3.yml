name: Chopin135 V0.3 experimental LKM

on:
  push:
    branches:
      - chopin144-dev-v0.3
      - codex/chopin135-experimental
    paths:
      - "chopin144_lkm/**"
      - ".github/workflows/chopin144-v0.3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev \
            libncurses-dev clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf kmod zip

      - name: Prepare kernel headers
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabihf-
          LOCALVERSION: -gfc959c14c332
        run: |
          set -euxo pipefail
          mkdir -p out
          chmod +x scripts/clang-android.sh
          cp chopin144_lkm/target.config out/.config
          bash scripts/config --file out/.config --disable LOCALVERSION_AUTO
          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC=clang-12 LD=ld.lld-12 AR=llvm-ar-12 NM=llvm-nm-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 STRIP=llvm-strip-12 \
            HOSTCC=clang-12 HOSTCXX=clang++-12 LOCALVERSION="$LOCALVERSION" olddefconfig
          KREL="$(make -s O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" \
            CC=clang-12 LD=ld.lld-12 LOCALVERSION="$LOCALVERSION" kernelrelease)"
          echo "Build target release: $KREL"
          test "$KREL" = "4.14.357-Openela-Hua-gfc959c14c332"
          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" \
            CC=clang-12 LD=ld.lld-12 AR=llvm-ar-12 NM=llvm-nm-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 STRIP=llvm-strip-12 \
            HOSTCC=clang-12 HOSTCXX=clang++-12 LOCALVERSION="$LOCALVERSION" \
            -j2 prepare modules_prepare

      - name: Build external module
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabihf-
          LOCALVERSION: -gfc959c14c332
        run: |
          set -euxo pipefail
          make O=out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC=clang-12 LD=ld.lld-12 AR=llvm-ar-12 NM=llvm-nm-12 \
            OBJCOPY=llvm-objcopy-12 OBJDUMP=llvm-objdump-12 STRIP=llvm-strip-12 \
            HOSTCC=clang-12 HOSTCXX=clang++-12 LOCALVERSION="$LOCALVERSION" \
            KBUILD_MODPOST_WARN=1 M="$GITHUB_WORKSPACE/chopin144_lkm" modules -j2
          test -s chopin144_lkm/chopin144_experimental.ko

      - name: Normalize MODVERSIONS section for experimental ABI probe
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import pathlib, struct
          pathlib.Path("/tmp/chopin135-versions").write_bytes(struct.pack("<Q", 0) + bytes(56))
          PY
          if llvm-readelf-12 -S chopin144_lkm/chopin144_experimental.ko | grep -q '__versions'; then
            llvm-objcopy-12 --update-section __versions=/tmp/chopin135-versions chopin144_lkm/chopin144_experimental.ko
          else
            llvm-objcopy-12 --add-section __versions=/tmp/chopin135-versions chopin144_lkm/chopin144_experimental.ko
          fi
          llvm-readelf-12 -S chopin144_lkm/chopin144_experimental.ko | grep '__versions'
          modinfo -F vermagic chopin144_lkm/chopin144_experimental.ko

      - name: Assemble KernelSU package
        run: |
          set -euxo pipefail
          mkdir -p package
          cp chopin144_lkm/chopin144_experimental.ko package/
          cp chopin144_lkm/module.prop package/
          cp chopin144_lkm/service.sh package/
          cp chopin144_lkm/uninstall.sh package/
          cp chopin144_lkm/README.md package/
          cd package
          zip -r ../Chopin135_KernelSU_Experimental_V0.3.zip .
          cd ..
          cp chopin144_lkm/chopin144_experimental.ko Chopin135_Experimental_V0.3.ko
          {
            echo "kernelrelease=$(make -s O=out ARCH=arm64 LOCALVERSION=-gfc959c14c332 kernelrelease)"
            echo "vermagic=$(modinfo -F vermagic chopin144_lkm/chopin144_experimental.ko)"
            echo "source_commit=$GITHUB_SHA"
          } > build-info.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chopin135-Experimental-V0.3
          path: |
            Chopin135_KernelSU_Experimental_V0.3.zip
            Chopin135_Experimental_V0.3.ko
            build-info.txt
          if-no-files-found: error
          retention-days: 30
